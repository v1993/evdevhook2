name: Build and publish AppImages

env:
  # main at 2026-11-09
  SHARUN_URL: https://github.com/pkgforge-dev/Anylinux-AppImages/raw/e089c046e2bd34309d5e450713f5ea448cb7df52/useful-tools/quick-sharun.sh

on:
  pull_request:
  push:
    branches: main
  release:
    types: published

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: # args are required for git-based version detection
          ref: ${{ github.ref }}
          fetch-depth: 20
          fetch-tags: true

      - name: Expose slug values
        uses: rlespinasse/github-slug-action@v5

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v4

      - name: Build AppImage
        uses: docker/build-push-action@v7
        with:
          context: . # explicit path context is required for git-based version detection
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            SHARUN_URL
            OWNER=${{ env.GITHUB_REPOSITORY_OWNER_PART }}

      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.runner }}

    needs:
      - build

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Slugify platform
        uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: appimage-${{ steps.platform-slug.outputs.slug-url }}

      - name: Test AppImage on Alpine
        uses: addnab/docker-run-action@v3
        with:
          image: alpine
          options: -v ${{ github.workspace }}/assets:/appimage
          run: |
            apk add coreutils
            find /appimage/ -type f -name '*.AppImage' | while read -r appimage; do
              chmod +x "${appimage}"
              timeout 5 "${appimage}"
              rc="$?"
              if [ "$rc" -ne 124 ]; then
                echo >&2 "AppImage returned unexpected code $rc."
                if [ "$rc" -ne 0 ]; then exit "$rc"; else exit 1; fi
              fi
            done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    needs:
      - build
      - test

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: appimage-*
          merge-multiple: true

      - name: Create checksum for release assets
        shell: bash
        run: |
          algo="${SHA_ALGORITHM:-256}"
          find assets -type f | while read -r asset; do
            shasum --binary --algorithm "${algo}" "${asset}" >"${asset}.sha${algo}"
          done

      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: assets/*
